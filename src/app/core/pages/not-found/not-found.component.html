<div class="error-page container">
  <div class="error-card glass-panel">
    <div class="error-badge">404 Error</div>
    <h1 class="error-title">Level Not Found</h1>
    <p class="error-desc">
      The page or game session you are looking for doesn't exist, has been moved, or the link is invalid.
    </p>

    <div class="error-actions">
      <gc-button variant="primary" size="lg" (btnClick)="navigateHome()">
        Return to Dashboard
      </gc-button>
    </div>
  </div>
</div>
