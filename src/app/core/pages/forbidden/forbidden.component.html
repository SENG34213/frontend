<div class="error-page container">
  <div class="error-card glass-panel">
    <div class="error-badge">403 Restricted</div>
    <h1 class="error-title">Access Denied</h1>
    <p class="error-desc">
      You do not have the required administrative clearance to access this terminal. This attempt has been logged.
    </p>

    <div class="error-actions">
      <gc-button variant="primary" size="lg" (btnClick)="navigateBack()">
        Return to Safety
      </gc-button>
    </div>
  </div>
</div>
