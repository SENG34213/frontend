<div class="auth-page">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
    <h1>Sign in to Gaming Castle</h1>

    <label>
      Email
      <input type="email" formControlName="email" placeholder="you@example.com" />
    </label>
    <div class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
      Enter a valid email address.
    </div>

    <label>
      Password
      <input type="password" formControlName="password" placeholder="••••••••" />
    </label>
    <div class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
      Password is required.
    </div>

    <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="switch-link">No account yet? <a routerLink="/register">Register</a></p>
  </form>
</div>
