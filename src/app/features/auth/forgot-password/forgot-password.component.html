<app-auth-shell>
  <div class="auth-card-container">
    <header class="auth-title-section">
      <h1 class="auth-title">Reset your <span class="soldier-highlight">access</span></h1>
      <p class="auth-subtitle">Enter your email or phone number and we will send you a 6-digit code.</p>
    </header>

    <gc-card [glow]="'blue'" class="auth-glass-card">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="auth-form">
        <div class="form-field-group">
          <label [for]="'forgot-identifier'" class="field-label">EMAIL OR PHONE</label>
          <gc-input
            [inputId]="'forgot-identifier'"
            [formControl]="identifierControl"
            type="text"
            placeholder="player@gamingcastle.lk or 077 123 4567"
            [hasPrefix]="true"
            [errorMessage]="identifierErrorMessage"
            [required]="true">
            <span input-prefix class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
          </gc-input>
        </div>

        <div class="submit-section">
          <gc-button
            variant="primary"
            type="submit"
            [fullWidth]="true"
            [loading]="isSubmitting()"
            [disabled]="isSubmitting()">
            SEND CODE
          </gc-button>
        </div>

        <div class="auth-card-footer">
          <p class="switch-prompt">
            <a routerLink="/login" class="auth-action-link">Back to login</a>
          </p>
        </div>
      </form>
    </gc-card>
  </div>
</app-auth-shell>
